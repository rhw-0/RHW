name: RHW Pages Deploy

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Temporary RHW logo mirror probe
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL --retry 3 --max-time 20 https://i.imgur.com/TFXQ1So.png -o /tmp/rhw-logo.png
          printf 'RHW_LOGO_SHA256='
          sha256sum /tmp/rhw-logo.png | cut -d' ' -f1
          printf 'RHW_LOGO_BASE64='
          base64 -w0 /tmp/rhw-logo.png
          printf '\n'

      - name: Validate dashboard structure
        run: python3 scripts/validate_dashboard.py

      - name: Validate JavaScript syntax
        shell: bash
        run: |
          set -euo pipefail
          for file in js/*.js; do
            echo "Checking ${file}"
            node --check "${file}"
          done

      - name: Install smoke-test client
        run: python3 -m pip install --disable-pip-version-check --quiet websocket-client

      - name: Runtime smoke test
        run: python3 scripts/smoke_v40.py

  deploy:
    if: github.event_name != 'pull_request'
    needs: validate
    permissions:
      contents: read
      pages: write
      id-token: write
    concurrency:
      group: pages
      cancel-in-progress: true
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload static site
        uses: actions/upload-pages-artifact@v4
        with:
          path: .

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
